backend:
  name: github
  repo: VladiSkrivan/Vladi-Skrivan-gallery-
  branch: main

media_folder: images
public_folder: images

locale: cs

collections:
  - name: collections
    label: Kolekce
    label_singular: Kolekce
    folder: data/collections
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{name}}"
    fields:
      - { name: name, label: Název kolekce, widget: string }

  - name: paintings
    label: Obrazy
    label_singular: Obraz
    folder: data/paintings
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{title}} — {{collection}} — {{status}}"
    fields:
      - { name: title, label: Název, widget: string }
      - name: collection
        label: Kolekce
        widget: relation
        collection: collections
        search_fields: [name]
        value_field: name
        display_fields: [name]
      - { name: year, label: Rok, widget: number, value_type: int }
      - { name: size, label: Rozměr (cm), widget: string, required: false }
      - { name: technique, label: Technika, widget: string, required: false }
      - name: status
        label: Status
        widget: select
        options:
          - "K dispozici"
          - Prodáno
      - { name: price_czk, label: Cena CZK, widget: number, required: false }
      - { name: price_eur, label: Cena EUR, widget: number, required: false }
      - { name: story, label: Text autora, widget: text, required: false }
      - { name: image1, label: "Snímek 1 — Obraz v prostředí", widget: image, required: false }
      - { name: image2, label: "Snímek 2 — Celý obraz", widget: image, required: false }
      - { name: image3, label: "Snímek 3 — Obraz v detailu", widget: image, required: false }
      - { name: image4, label: "Snímek 4 — Obraz v prostředí", widget: image, required: false }
      - { name: on_web, label: Zobrazit na webu, widget: boolean, default: true }

  - name: about
    label: O umělkyni
    files:
      - name: about
        label: O umělkyni
        file: data/about.json
        fields:
          - { name: photo, label: Fotografie, widget: image }
          - { name: tagline, label: Podtitulek (anglicky), widget: string }
          - name: bio
            label: Text "O umělkyni" (odstavce)
            widget: list
            field: { name: text, label: Odstavec, widget: text }
          - name: story
            label: Text "Můj příběh" (odstavce)
            widget: list
            field: { name: text, label: Odstavec, widget: text }

  - name: exhibitions
    label: Výstavy
    files:
      - name: exhibitions
        label: Seznam výstav
        file: data/exhibitions.json
        fields:
          - name: exhibitions
            label: Výstavy
            widget: list
            summary: "{{fields.year}} — {{fields.text}}"
            fields:
              - { name: year, label: Rok, widget: number, value_type: int }
              - { name: text, label: Text, widget: string }

  - name: klub
    label: Klub
    files:
      - name: klub
        label: Klub přátel
        file: data/klub.json
        fields:
          - { name: title_cs, label: Název sekce, widget: string }
          - { name: tagline_cs, label: Úvodní text, widget: text }
          - name: benefits_cs
            label: Výhody členství
            widget: list
            field: { name: text, label: Výhoda, widget: string }
          - { name: form_title_cs, label: Nadpis formuláře, widget: string }
          - { name: form_subtitle_cs, label: Podnázev formuláře, widget: string }

  - name: rozhovor
    label: Rozhovor
    files:
      - name: rozhovor
        label: Rozhovor
        file: data/rozhovor.json
        fields:
          - { name: subtitle_cs, label: Podtitulek, widget: string }
          - name: qa
            label: Otázky a odpovědi
            widget: list
            summary: "{{fields.q_cs}}"
            fields:
              - { name: q_cs, label: Otázka, widget: string }
              - { name: a_cs, label: Odpověď, widget: text }

  - name: blog
    label: Blog Pozdní sběr
    files:
      - name: blog
        label: Blog
        file: data/blog.json
        fields:
          - { name: quote_cs, label: Citát (hlavička), widget: string }
          - { name: intro_cs, label: Úvod (odstavce oddělené prázdným řádkem), widget: text }
          - name: articles
            label: Články
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: tag, label: Kategorie, widget: string }
              - { name: title, label: Název článku, widget: string }
              - { name: lead, label: Perex, widget: text }
              - { name: cover, label: Titulní fotka, widget: image }
              - { name: body_cs, label: Text článku (HTML), widget: text }

  - name: prints
    label: Umělecké tisky
    label_singular: Tisk
    folder: data/prints
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{title}} — {{subtitle}}"
    fields:
      - { name: title, label: Název, widget: string }
      - { name: subtitle, label: Podtitul, widget: string, required: false }
      - { name: technique, label: Technika, widget: string, required: false }
      - { name: size, label: Rozměr, widget: string, required: false }
      - { name: description, label: Popis, widget: text, required: false }
      - { name: image1, label: "Snímek 1 — Tisk v prostředí", widget: image, required: false }
      - { name: image2, label: "Snímek 2 — Celý tisk", widget: image, required: false }
      - { name: image3, label: "Snímek 3 — Detail tisku", widget: image, required: false }
      - { name: image4, label: "Snímek 4 — Tisk v prostředí", widget: image, required: false }
