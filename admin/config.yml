backend:
  name: github
  repo: VladiSkrivan/Vladi-Skrivan-gallery-
  branch: main

media_folder: images
public_folder: images

locale: cs

collections:
  - name: paintings
    label: Obrazy
    label_singular: Obraz
    files:
      - name: paintings
        label: Všechny obrazy
        file: data/paintings.json
        fields:
          - name: paintings
            label: Obrazy
            widget: list
            label_singular: Obraz
            summary: "{{fields.title}} — {{fields.status}}"
            fields:
              - { name: title, label: Název, widget: string }
              - { name: collection, label: Kolekce, widget: string }
              - { name: year, label: Rok, widget: number, value_type: int }
              - { name: size, label: Rozměr (cm), widget: string, required: false }
              - { name: technique, label: Technika, widget: string, required: false }
              - name: status
                label: Status
                widget: select
                options:
                  - "K dispozici"
                  - Prodáno
              - { name: price_czk, label: Cena CZK, widget: number, required: false }
              - { name: price_eur, label: Cena EUR, widget: number, required: false }
              - { name: story, label: Text autora, widget: text, required: false }
              - { name: image, label: Hlavní foto (místnost), widget: image, required: false }
              - name: images
                label: Všechny fotky (1–4)
                widget: list
                field: { name: src, label: Foto, widget: image }
              - { name: on_web, label: Zobrazit na webu, widget: boolean, default: true }

  - name: about
    label: O umělkyni
    files:
      - name: about
        label: O umělkyni
        file: data/about.json
        fields:
          - { name: photo, label: Fotografie, widget: image }
          - { name: tagline, label: Podtitulek (anglicky), widget: string }
          - name: bio
            label: Text "O umělkyni" (odstavce)
            widget: list
            field: { name: text, label: Odstavec, widget: text }
          - name: story
            label: Text "Můj příběh" (odstavce)
            widget: list
            field: { name: text, label: Odstavec, widget: text }

  - name: exhibitions
    label: Výstavy
    files:
      - name: exhibitions
        label: Seznam výstav
        file: data/exhibitions.json
        fields:
          - name: exhibitions
            label: Výstavy
            widget: list
            summary: "{{fields.year}} — {{fields.text_cs}}"
            fields:
              - { name: year, label: Rok, widget: number, value_type: int }
              - { name: text_cs, label: Text (česky), widget: string }
              - { name: text_en, label: Text (anglicky), widget: string, required: false }
              - { name: text_it, label: Text (italsky), widget: string, required: false }

  - name: klub
    label: Klub
    files:
      - name: klub
        label: Klub přátel
        file: data/klub.json
        fields:
          - { name: title_cs, label: Název sekce, widget: string }
          - { name: tagline_cs, label: Úvodní text, widget: text }
          - name: benefits_cs
            label: Výhody členství
            widget: list
            field: { name: text, label: Výhoda, widget: string }
          - { name: form_title_cs, label: Nadpis formuláře, widget: string }
          - { name: form_subtitle_cs, label: Podnázev formuláře, widget: string }

  - name: rozhovor
    label: Rozhovor
    files:
      - name: rozhovor
        label: Rozhovor
        file: data/rozhovor.json
        fields:
          - { name: subtitle_cs, label: Podtitulek, widget: string }
          - name: qa
            label: Otázky a odpovědi
            widget: list
            summary: "{{fields.q_cs}}"
            fields:
              - { name: q_cs, label: Otázka, widget: string }
              - { name: a_cs, label: Odpověď, widget: text }

  - name: blog
    label: Blog Pozdní sběr
    files:
      - name: blog
        label: Blog
        file: data/blog.json
        fields:
          - { name: quote_cs, label: Citát (hlavička), widget: string }
          - { name: intro_cs, label: Úvod (odstavce oddělené prázdným řádkem), widget: text }
          - name: articles
            label: Články
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: tag, label: Kategorie, widget: string }
              - { name: title, label: Název článku, widget: string }
              - { name: lead, label: Perex, widget: text }
              - { name: cover, label: Titulní fotka, widget: image }
              - { name: body_cs, label: Text článku (HTML), widget: text }

  - name: prints
    label: Umělecké tisky
    label_singular: Tisk
    files:
      - name: prints
        label: Všechny tisky
        file: data/prints.json
        fields:
          - name: prints
            label: Tisky
            widget: list
            label_singular: Tisk
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Název, widget: string }
              - { name: subtitle, label: Podtitul, widget: string, required: false }
              - { name: technique, label: Technika, widget: string, required: false }
              - { name: size, label: Rozměr, widget: string, required: false }
              - { name: description, label: Popis, widget: text, required: false }
              - { name: image, label: Náhledové foto, widget: image, required: false }
              - name: images
                label: Detailní fotky
                widget: list
                field: { name: src, label: Foto, widget: image }
